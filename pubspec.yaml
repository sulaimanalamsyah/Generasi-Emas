name: generasi_emas
description: "Generasi Emas - Partisipasi Ibu & Edukasi Stunting (Ibu)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  http: ^1.2.2
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.12.0
  url_launcher: ^6.3.0
  intl: ^0.20.2
  video_player: ^2.8.2
  chewie: ^1.7.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.1
  connectivity_plus: ^7.0.0
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/

